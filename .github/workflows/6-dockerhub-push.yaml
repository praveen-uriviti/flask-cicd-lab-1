
name: Lab 6 - Pipeline A - Push image to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

env:
  IMAGE: praveenuriviti/flask-cicd-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  push-dockerhub:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

     
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Write summary
        run: echo "Pushed ${{ env.IMAGE }}:${{ github.sha }} to Docker Hub" >> "$GITHUB_STEP_SUMMARY"
