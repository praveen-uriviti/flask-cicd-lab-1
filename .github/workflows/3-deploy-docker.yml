
name: Lab 3 Test, Build Image and Deploy Container to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE:  praveenuriviti/flask-cicd-lab-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

   
      - name: Diagnose Docker Hub authentication
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "1. Checking Docker Hub credentials..."

          RESPONSE=$(curl -fsS \
            -X POST https://hub.docker.com/v2/auth/token \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg user "$DH_USER" \
              --arg token "$DH_TOKEN" \
              '{identifier: $user, secret: $token}')")

          echo "$RESPONSE" | jq -e '.access_token | strings | select(length > 0)' > /dev/null

          echo "Docker Hub PAT authentication successful"

          echo "2. Checking Docker Registry connection..."

          curl -sS -D /tmp/registry-headers \
            -o /tmp/registry-response \
            https://registry-1.docker.io/v2/

          head -n 1 /tmp/registry-headers

          echo "3. Testing Docker login..."

          printf '%s' "$DH_TOKEN" | \
            docker login docker.io \
            --username "$DH_USER" \
            --password-stdin


      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull and run the new container on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            docker pull "$IMAGE"
            docker rm -f flask-app || true
            docker run -d --name flask-app --restart unless-stopped \
              -p 80:5000 "$IMAGE"
            sleep 5
            curl --fail http://localhost/health
            docker image prune -f

